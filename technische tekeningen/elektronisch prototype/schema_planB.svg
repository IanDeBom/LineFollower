  <!-- ===================== opmerkingen ===================== -->
  <g font-size="12">
    <text x="60" y="806" font-weight="bold" font-size="13">Opmerkingen</text>
    <text x="60" y="826">1. -U3 levert 5 V aan de 5V-pin van -U1 (niet via VIN). Eerst -U3 instellen op 5 V met een multimeter.</text>
    <text x="60" y="844">2. VM van -U4 komt rechtstreeks van de batterij (na -S1): motoren 6 V, snelheid beperken met PWM.</text>
    <text x="60" y="862">3. -R1 / -R2: spanningsdeler 5 V naar 3,3 V voor RXD van -U2.</text>
    <text x="60" y="880">4. Power-led: ingebouwde led van -U1. Glijder als derde steunpunt (mechanisch).</text>
    <text x="60" y="898">5. Pinverdeling = proof of concepts (code/proof of concepts).</text>
  </g>

