  <!-- ===================== opmerkingen ===================== -->
  <g font-size="13">
    <text x="60" y="800" font-weight="bold">Opmerkingen</text>
    <text x="60" y="822">1. -U1 via USB gevoed; VM van -U2 aan +5V (leds i.p.v. motoren). Bij de motoren: VM aan de batterij (7,4 V).</text>
    <text x="60" y="842">2. -M1 / -M2 gesimuleerd met 2 antiparallelle leds: richting = welke led brandt, snelheid = helderheid.</text>
    <text x="60" y="862">3. AIN1..BIN2 op PWM-pinnen (~): D5/D6 timer 0, D9/D10 timer 1.</text>
    <text x="60" y="882">4. STBY (= nSLEEP van de DRV8833): hoog = driver aan, laag = alle uitgangen uit.</text>
    <text x="60" y="902">5. Pinnamen volgens de gebruikte DRV8833-module; deze module heeft geen nFAULT-uitgang.</text>
  </g>

