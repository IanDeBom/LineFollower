  <text x="1036" y="354" text-anchor="end" font-size="12">vooruit</text>
  <text x="1036" y="369" text-anchor="end" font-size="12">groen</text>
  <text x="1204" y="338" font-weight="bold">-H2</text>
  <text x="1204" y="354" font-size="12">achteruit</text>
  <text x="1204" y="369" font-size="12">rood</text>
