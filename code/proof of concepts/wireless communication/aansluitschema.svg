<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000">
  <rect width="1400" height="990" fill="#ffffff"/>

  <!-- ===================== kader + vakindeling ===================== -->
  <g fill="none" stroke="#000">
    <rect x="10" y="10" width="1380" height="970" stroke-width="2"/>
    <rect x="40" y="40" width="1320" height="910" stroke-width="2"/>
  </g>
  <g stroke="#000" stroke-width="1">
    <!-- kolommen 1..8 (165 px) -->
    <line x1="205" y1="10" x2="205" y2="40"/><line x1="370" y1="10" x2="370" y2="40"/>
    <line x1="535" y1="10" x2="535" y2="40"/><line x1="700" y1="10" x2="700" y2="40"/>
    <line x1="865" y1="10" x2="865" y2="40"/><line x1="1030" y1="10" x2="1030" y2="40"/>
    <line x1="1195" y1="10" x2="1195" y2="40"/>
    <line x1="205" y1="950" x2="205" y2="980"/><line x1="370" y1="950" x2="370" y2="980"/>
    <line x1="535" y1="950" x2="535" y2="980"/><line x1="700" y1="950" x2="700" y2="980"/>
    <line x1="865" y1="950" x2="865" y2="980"/><line x1="1030" y1="950" x2="1030" y2="980"/>
    <line x1="1195" y1="950" x2="1195" y2="980"/>
    <!-- rijen A..F (151,67 px) -->
    <line x1="10" y1="191.7" x2="40" y2="191.7"/><line x1="10" y1="343.3" x2="40" y2="343.3"/>
    <line x1="10" y1="495" x2="40" y2="495"/><line x1="10" y1="646.7" x2="40" y2="646.7"/>
    <line x1="10" y1="798.3" x2="40" y2="798.3"/>
    <line x1="1360" y1="191.7" x2="1390" y2="191.7"/><line x1="1360" y1="343.3" x2="1390" y2="343.3"/>
    <line x1="1360" y1="495" x2="1390" y2="495"/><line x1="1360" y1="646.7" x2="1390" y2="646.7"/>
    <line x1="1360" y1="798.3" x2="1390" y2="798.3"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="122" y="30">1</text><text x="287" y="30">2</text><text x="452" y="30">3</text><text x="617" y="30">4</text>
    <text x="782" y="30">5</text><text x="947" y="30">6</text><text x="1112" y="30">7</text><text x="1277" y="30">8</text>
    <text x="122" y="970">1</text><text x="287" y="970">2</text><text x="452" y="970">3</text><text x="617" y="970">4</text>
    <text x="782" y="970">5</text><text x="947" y="970">6</text><text x="1112" y="970">7</text><text x="1277" y="970">8</text>
    <text x="25" y="121">A</text><text x="25" y="272">B</text><text x="25" y="424">C</text>
    <text x="25" y="576">D</text><text x="25" y="727">E</text><text x="25" y="879">F</text>
    <text x="1375" y="121">A</text><text x="1375" y="272">B</text><text x="1375" y="424">C</text>
    <text x="1375" y="576">D</text><text x="1375" y="727">E</text><text x="1375" y="879">F</text>
  </g>

  <!-- ===================== potentiaalrails ===================== -->
  <g stroke="#000" stroke-width="2">
    <line x1="120" y1="130" x2="1260" y2="130"/>
    <line x1="120" y1="740" x2="1260" y2="740"/>
  </g>
  <g font-weight="bold">
    <text x="70" y="135">+5V</text>
    <text x="68" y="745">GND</text>
    <text x="1268" y="135">+5V</text>
    <text x="1268" y="745">GND</text>
  </g>

  <!-- ===================== -U1 Arduino Nano ===================== -->
  <rect x="200" y="260" width="220" height="380" fill="none" stroke="#000" stroke-width="2"/>
  <text x="310" y="440" text-anchor="middle" font-weight="bold" font-size="16">-U1</text>
  <text x="310" y="460" text-anchor="middle">Arduino Nano</text>
  <!-- pinnen -->
  <g stroke="#000" stroke-width="2">
    <line x1="310" y1="130" x2="310" y2="260"/>   <!-- 5V -->
    <line x1="310" y1="640" x2="310" y2="740"/>   <!-- GND -->
    <line x1="420" y1="320" x2="980" y2="320"/>   <!-- D11 - TXD -->
    <line x1="420" y1="400" x2="580" y2="400"/>   <!-- D12 - R1 -->
    <line x1="660" y1="400" x2="980" y2="400"/>   <!-- R1 - RXD -->
    <line x1="420" y1="560" x2="520" y2="560"/>   <!-- D4 - R3 -->
  </g>
  <g font-size="13">
    <text x="318" y="280">5V</text>
    <text x="318" y="630">GND</text>
    <text x="412" y="325" text-anchor="end">D11</text>
    <text x="412" y="405" text-anchor="end">D12</text>
    <text x="412" y="565" text-anchor="end">D4</text>
    <text x="208" y="345">USB</text>
  </g>
  <!-- pinnummers Nano-header -->
  <g font-size="11" fill="#555">
    <text x="296" y="252" text-anchor="end">27</text>
    <text x="296" y="656" text-anchor="end">29</text>
    <text x="428" y="314">14</text>
    <text x="428" y="394">15</text>
    <text x="428" y="554">7</text>
  </g>
  <!-- USB naar pc -->
  <g stroke="#000" stroke-width="2"><line x1="120" y1="340" x2="200" y2="340"/></g>
  <text x="60" y="320" font-size="12">PC (USB)</text>
  <text x="60" y="365" font-size="12">voeding +</text>
  <text x="60" y="380" font-size="12">upload / debug</text>

  <!-- ===================== -R1 1 kΩ ===================== -->
  <rect x="580" y="388" width="80" height="24" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="620" y="378" text-anchor="middle" font-weight="bold">-R1</text>
  <text x="620" y="436" text-anchor="middle">1 kΩ</text>

  <!-- ===================== -R2 2 kΩ ===================== -->
  <g stroke="#000" stroke-width="2">
    <line x1="820" y1="400" x2="820" y2="500"/>
    <line x1="820" y1="580" x2="820" y2="740"/>
  </g>
  <rect x="808" y="500" width="24" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="842" y="535" font-weight="bold">-R2</text>
  <text x="842" y="553">2 kΩ</text>
  <text x="842" y="571" font-size="11" fill="#555">(of 2,2 kΩ)</text>
  <circle cx="820" cy="400" r="5" fill="#000"/>
  <circle cx="820" cy="740" r="5" fill="#000"/>
  <text x="830" y="392" font-size="12" fill="#555">≈ 3,3 V</text>

  <!-- ===================== -R3 560 Ω + -H1 led ===================== -->
  <rect x="520" y="548" width="80" height="24" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="560" y="538" text-anchor="middle" font-weight="bold">-R3</text>
  <text x="560" y="596" text-anchor="middle">560 Ω</text>
  <g stroke="#000" stroke-width="2" fill="none">
    <polyline points="600,560 700,560 700,620"/>
    <line x1="700" y1="660" x2="700" y2="740"/>
    <!-- led-symbool: driehoek naar beneden + kathodestreep -->
    <polygon points="680,620 720,620 700,655" fill="#fff"/>
    <line x1="680" y1="657" x2="720" y2="657"/>
    <!-- lichtpijlen -->
    <line x1="724" y1="628" x2="744" y2="614"/>
    <line x1="728" y1="642" x2="748" y2="628"/>
  </g>
  <g fill="#000">
    <polygon points="744,614 735,615 740,622"/>
    <polygon points="748,628 739,629 744,636"/>
  </g>
  <circle cx="700" cy="740" r="5" fill="#000"/>
  <text x="654" y="635" text-anchor="end" font-weight="bold">-H1</text>
  <text x="654" y="653" text-anchor="end">led</text>

  <!-- signaalnamen -->
  <g font-size="12" fill="#555">
    <text x="700" y="312">BT_RX</text>
    <text x="700" y="392">BT_TX</text>
    <text x="445" y="552">LED</text>
  </g>

  <!-- ===================== -U2 BT05 ===================== -->
  <rect x="980" y="260" width="200" height="220" fill="none" stroke="#000" stroke-width="2"/>
  <text x="1080" y="370" text-anchor="middle" font-weight="bold" font-size="16">-U2</text>
  <text x="1080" y="390" text-anchor="middle">BT05</text>
  <text x="1080" y="408" text-anchor="middle" font-size="12">bluetooth (BLE)</text>
  <g stroke="#000" stroke-width="2">
    <line x1="1080" y1="130" x2="1080" y2="260"/>  <!-- VCC -->
    <line x1="1080" y1="480" x2="1080" y2="740"/>  <!-- GND -->
    <line x1="1180" y1="320" x2="1220" y2="320"/>  <!-- STATE nc -->
    <line x1="1180" y1="400" x2="1220" y2="400"/>  <!-- EN nc -->
  </g>
  <g stroke="#000" stroke-width="2">
    <line x1="1212" y1="312" x2="1228" y2="328"/><line x1="1228" y1="312" x2="1212" y2="328"/>
    <line x1="1212" y1="392" x2="1228" y2="408"/><line x1="1228" y1="392" x2="1212" y2="408"/>
  </g>
  <g font-size="13">
    <text x="988" y="325">TXD</text>
    <text x="988" y="405">RXD</text>
    <text x="1088" y="280">VCC</text>
    <text x="1088" y="472">GND</text>
    <text x="1172" y="325" text-anchor="end">STATE</text>
    <text x="1172" y="405" text-anchor="end">EN</text>
    <text x="1236" y="325" font-size="12" fill="#555">n.c.</text>
    <text x="1236" y="405" font-size="12" fill="#555">n.c.</text>
  </g>

  <!-- verbindingspunten op de rails -->
  <circle cx="310" cy="130" r="5" fill="#000"/>
  <circle cx="1080" cy="130" r="5" fill="#000"/>
  <circle cx="310" cy="740" r="5" fill="#000"/>
  <circle cx="1080" cy="740" r="5" fill="#000"/>

  <!-- ===================== opmerkingen ===================== -->
  <g font-size="13">
    <text x="60" y="800" font-weight="bold">Opmerkingen</text>
    <text x="60" y="822">1. -U1 wordt gevoed via USB van de pc (geen batterij nodig voor deze proof of concept).</text>
    <text x="60" y="842">2. -R1 / -R2 vormen een spanningsdeler: 5 V van D12 → ± 3,3 V op RXD van -U2.</text>
    <text x="60" y="862">3. -U2 BT05 (Bluetooth Low Energy, HM-10 compatibel): 9600 baud, service FFE0 / characteristic FFE1.</text>
    <text x="60" y="882">4. Pinnummers (grijs) volgens de header van de Arduino Nano.</text>
    <text x="60" y="902">5. Aansluitingen volgen het prototype-aansluitschema (technische tekeningen/elektronisch prototype).</text>
  </g>

  <!-- ===================== titelblok ===================== -->
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="900" y="790" width="460" height="160"/>
  </g>
  <g stroke="#000" stroke-width="1">
    <line x1="900" y1="830" x2="1360" y2="830"/>
    <line x1="900" y1="870" x2="1360" y2="870"/>
    <line x1="900" y1="910" x2="1360" y2="910"/>
    <line x1="1130" y1="870" x2="1130" y2="950"/>
    <line x1="1250" y1="910" x2="1250" y2="950"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="906" y="802">project</text>
    <text x="906" y="842">tekening</text>
    <text x="906" y="882">getekend</text>
    <text x="1136" y="882">datum</text>
    <text x="906" y="922">bestand</text>
    <text x="1136" y="922">revisie</text>
    <text x="1256" y="922">blad</text>
  </g>
  <g>
    <text x="906" y="823" font-size="17" font-weight="bold">LineFollower</text>
    <text x="906" y="863" font-size="15" font-weight="bold">PoC draadloze communicatie – aansluitschema</text>
    <text x="906" y="902" font-size="14">debomian</text>
    <text x="1136" y="902" font-size="14">21-10-2026</text>
    <text x="906" y="942" font-size="13">aansluitschema.svg</text>
    <text x="1136" y="942" font-size="14">A</text>
    <text x="1256" y="942" font-size="14">1 / 1</text>
  </g>
</svg>
