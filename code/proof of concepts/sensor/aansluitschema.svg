    <line x1="535" y1="10" x2="535" y2="40"/><line x1="700" y1="10" x2="700" y2="40"/>
    <line x1="865" y1="10" x2="865" y2="40"/><line x1="1030" y1="10" x2="1030" y2="40"/>
    <line x1="1195" y1="10" x2="1195" y2="40"/>
    <line x1="205" y1="950" x2="205" y2="980"/><line x1="370" y1="950" x2="370" y2="980"/>
    <line x1="535" y1="950" x2="535" y2="980"/><line x1="700" y1="950" x2="700" y2="980"/>
    <line x1="865" y1="950" x2="865" y2="980"/><line x1="1030" y1="950" x2="1030" y2="980"/>
    <line x1="1195" y1="950" x2="1195" y2="980"/>
    <!-- rijen A..F (151,67 px) -->
    <line x1="10" y1="191.7" x2="40" y2="191.7"/><line x1="10" y1="343.3" x2="40" y2="343.3"/>
    <line x1="10" y1="495" x2="40" y2="495"/><line x1="10" y1="646.7" x2="40" y2="646.7"/>
    <line x1="10" y1="798.3" x2="40" y2="798.3"/>
    <line x1="1360" y1="191.7" x2="1390" y2="191.7"/><line x1="1360" y1="343.3" x2="1390" y2="343.3"/>
    <line x1="1360" y1="495" x2="1390" y2="495"/><line x1="1360" y1="646.7" x2="1390" y2="646.7"/>
    <line x1="1360" y1="798.3" x2="1390" y2="798.3"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="122" y="30">1</text><text x="287" y="30">2</text><text x="452" y="30">3</text><text x="617" y="30">4</text>
    <text x="782" y="30">5</text><text x="947" y="30">6</text><text x="1112" y="30">7</text><text x="1277" y="30">8</text>
    <text x="122" y="970">1</text><text x="287" y="970">2</text><text x="452" y="970">3</text><text x="617" y="970">4</text>
    <text x="782" y="970">5</text><text x="947" y="970">6</text><text x="1112" y="970">7</text><text x="1277" y="970">8</text>
    <text x="25" y="121">A</text><text x="25" y="272">B</text><text x="25" y="424">C</text>
    <text x="25" y="576">D</text><text x="25" y="727">E</text><text x="25" y="879">F</text>
    <text x="1375" y="121">A</text><text x="1375" y="272">B</text><text x="1375" y="424">C</text>
    <text x="1375" y="576">D</text><text x="1375" y="727">E</text><text x="1375" y="879">F</text>
