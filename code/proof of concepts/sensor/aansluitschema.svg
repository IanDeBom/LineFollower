    <line x1="250" y1="690" x2="250" y2="740"/>
    <line x1="70" y1="290" x2="150" y2="290"/>
  </g>
  <g font-size="13">
    <text x="258" y="220">5V</text>
    <text x="258" y="680">GND</text>
    <text x="158" y="295">USB</text>
  </g>
  <text x="56" y="275" font-size="12">PC (USB)</text>
  <text x="56" y="312" font-size="12">voeding +</text>
  <text x="56" y="327" font-size="12">debug</text>
  <g font-size="11" fill="#555">
    <text x="236" y="192" text-anchor="end">27</text>
    <text x="236" y="706" text-anchor="end">29</text>
  </g>

  <!-- ===================== -U2 QTR-8A ===================== -->
  <rect x="650" y="200" width="200" height="490" fill="none" stroke="#000" stroke-width="2"/>
  <text x="780" y="440" text-anchor="middle" font-weight="bold" font-size="16">-U2</text>
  <text x="780" y="460" text-anchor="middle">QTR-8A</text>
  <text x="780" y="478" text-anchor="middle" font-size="12">lijnsensor</text>
  <g stroke="#000" stroke-width="2">
    <line x1="750" y1="120" x2="750" y2="200"/>
    <line x1="750" y1="690" x2="750" y2="740"/>
  </g>
  <g font-size="13">
    <text x="758" y="220">VCC</text>
    <text x="758" y="680">GND</text>
  </g>
  <line x1="350" y1="250" x2="650" y2="250" stroke="#000" stroke-width="2"/>
  <text x="342" y="255" text-anchor="end" font-size="13">A0</text>
  <text x="358" y="244" font-size="11" fill="#555">19</text>
  <text x="658" y="255" font-size="13">1</text>
  <text x="500" y="244" text-anchor="middle" font-size="12" fill="#555">sensor 1</text>
  <line x1="350" y1="300" x2="650" y2="300" stroke="#000" stroke-width="2"/>
  <text x="342" y="305" text-anchor="end" font-size="13">A1</text>
  <text x="358" y="294" font-size="11" fill="#555">20</text>
  <text x="658" y="305" font-size="13">2</text>
  <text x="500" y="294" text-anchor="middle" font-size="12" fill="#555">sensor 2</text>
  <line x1="350" y1="350" x2="650" y2="350" stroke="#000" stroke-width="2"/>
  <text x="342" y="355" text-anchor="end" font-size="13">A2</text>
  <text x="358" y="344" font-size="11" fill="#555">21</text>
  <text x="658" y="355" font-size="13">3</text>
  <text x="500" y="344" text-anchor="middle" font-size="12" fill="#555">sensor 3</text>
  <line x1="350" y1="400" x2="650" y2="400" stroke="#000" stroke-width="2"/>
  <text x="342" y="405" text-anchor="end" font-size="13">A3</text>
  <text x="358" y="394" font-size="11" fill="#555">22</text>
  <text x="658" y="405" font-size="13">4</text>
  <text x="500" y="394" text-anchor="middle" font-size="12" fill="#555">sensor 4</text>
  <line x1="350" y1="450" x2="650" y2="450" stroke="#000" stroke-width="2"/>
  <text x="342" y="455" text-anchor="end" font-size="13">A4</text>
  <text x="358" y="444" font-size="11" fill="#555">23</text>
  <text x="658" y="455" font-size="13">5</text>
  <text x="500" y="444" text-anchor="middle" font-size="12" fill="#555">sensor 5</text>
  <line x1="350" y1="500" x2="650" y2="500" stroke="#000" stroke-width="2"/>
  <text x="342" y="505" text-anchor="end" font-size="13">A5</text>
  <text x="358" y="494" font-size="11" fill="#555">24</text>
  <text x="658" y="505" font-size="13">6</text>
  <text x="500" y="494" text-anchor="middle" font-size="12" fill="#555">sensor 6</text>
  <line x1="350" y1="550" x2="650" y2="550" stroke="#000" stroke-width="2"/>
  <text x="342" y="555" text-anchor="end" font-size="13">A6</text>
  <text x="358" y="544" font-size="11" fill="#555">25</text>
  <text x="658" y="555" font-size="13">7</text>
  <text x="500" y="544" text-anchor="middle" font-size="12" fill="#555">sensor 7</text>
  <line x1="350" y1="600" x2="650" y2="600" stroke="#000" stroke-width="2"/>
  <text x="342" y="605" text-anchor="end" font-size="13">A7</text>
  <text x="358" y="594" font-size="11" fill="#555">26</text>
  <text x="658" y="605" font-size="13">8</text>
  <text x="500" y="594" text-anchor="middle" font-size="12" fill="#555">sensor 8</text>
  <line x1="350" y1="645" x2="650" y2="645" stroke="#000" stroke-width="2"/>
  <text x="342" y="650" text-anchor="end" font-size="13">D7</text>
  <text x="358" y="639" font-size="11" fill="#555">10</text>
  <text x="658" y="650" font-size="13">LEDON</text>
  <text x="500" y="639" text-anchor="middle" font-size="12" fill="#555">IR-leds aan/uit</text>
  <text x="420" y="232" font-size="11" fill="#555">links</text>
  <text x="420" y="622" font-size="11" fill="#555">rechts</text>

  <circle cx="250" cy="120" r="5" fill="#000"/>
  <circle cx="750" cy="120" r="5" fill="#000"/>
  <circle cx="250" cy="740" r="5" fill="#000"/>
  <circle cx="750" cy="740" r="5" fill="#000"/>

  <!-- ===================== detail: 1 kanaal van de QTR-8A ===================== -->
  <rect x="930" y="170" width="390" height="510" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="945" y="192" font-size="13" font-weight="bold" fill="#555">detail -U2: 1 van de 8 kanalen (intern)</text>
  <g stroke="#000" stroke-width="2" fill="none">
    <!-- VCC intern -->
    <line x1="980" y1="230" x2="1280" y2="230"/>
    <!-- pull-up + fototransistor -->
    <line x1="1200" y1="230" x2="1200" y2="270"/>
    <rect x="1188" y="270" width="24" height="70" fill="#fff"/>
    <line x1="1200" y1="340" x2="1200" y2="420"/>
    <line x1="1200" y1="380" x2="1280" y2="380"/>
    <line x1="1200" y1="420" x2="1186" y2="432"/>
    <circle cx="1180" cy="450" r="24"/>
    <line x1="1170" y1="434" x2="1170" y2="466"/>
    <line x1="1170" y1="442" x2="1186" y2="432"/>
    <line x1="1170" y1="458" x2="1192" y2="472"/>
    <line x1="1192" y1="472" x2="1200" y2="480"/>
    <line x1="1200" y1="480" x2="1200" y2="600"/>
    <!-- IR-led -->
    <line x1="1020" y1="230" x2="1020" y2="400"/>
    <polygon points="1002,400 1038,400 1020,432" fill="#fff"/>
    <line x1="1002" y1="434" x2="1038" y2="434"/>
    <line x1="1020" y1="434" x2="1020" y2="500"/>
    <rect x="1008" y="500" width="24" height="50" fill="#fff"/>
    <line x1="1020" y1="550" x2="1020" y2="600"/>
    <line x1="980" y1="600" x2="1280" y2="600"/>
  </g>
  <!-- pijl emitter -->
  <polygon points="1192,472 1182,470 1188,463" fill="#000"/>
  <!-- licht: led -> ondergrond -> fototransistor -->
  <g stroke="#c0392b" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <polyline points="1045,420 1095,470 1145,440"/>
  </g>
  <polygon points="1145,440 1135,441 1140,449" fill="#c0392b"/>
  <text x="1095" y="492" text-anchor="middle" font-size="11" fill="#c0392b">IR-licht via</text>
  <text x="1095" y="505" text-anchor="middle" font-size="11" fill="#c0392b">de ondergrond</text>
  <g font-size="12">
    <text x="988" y="222">VCC</text>
    <text x="988" y="618">GND</text>
    <text x="1220" y="300">47 kΩ</text>
    <text x="1220" y="315" font-size="11" fill="#555">pull-up</text>
    <text x="1284" y="376" text-anchor="end" font-size="12">→ uitgang n</text>
    <text x="1212" y="455">QRE1113</text>
    <text x="1212" y="469" font-size="11" fill="#555">fototransistor</text>
    <text x="970" y="420" text-anchor="end">IR</text>
    <text x="1040" y="530">via LEDON</text>
    <text x="1040" y="544" font-size="11" fill="#555">(transistor + R)</text>
  </g>
  <circle cx="1200" cy="380" r="4" fill="#000"/>
  <g font-size="11" fill="#333">
    <text x="945" y="650">wit = veel reflectie → transistor geleidt → laag (± 0–200)</text>
  </g>
  <text x="945" y="668" font-size="11" fill="#333">zwart = weinig reflectie → pull-up trekt hoog (± 800–1023)</text>

  <!-- ===================== opmerkingen ===================== -->
  <g font-size="13">
    <text x="60" y="800" font-weight="bold">Opmerkingen</text>
    <text x="60" y="822">1. -U1 via USB gevoed; -U2 op +5V (3,3 V-bypass jumper van de QTR-8A NIET sluiten).</text>
    <text x="60" y="842">2. Sensor 1..8 → A0..A7: de 8 analoge ingangen van de Nano (A6 / A7 zijn enkel analoog).</text>
    <text x="60" y="862">3. ADC-referentie = 5 V = voeding van -U2: de uitgang gebruikt het volledige bereik 0..1023.</text>
    <text x="60" y="882">4. LEDON mag ook open blijven (intern pull-up = leds altijd aan); via D7 kan omgevingslicht gemeten worden.</text>
    <text x="60" y="902">5. Optimale afstand sensor – ondergrond: ± 3 mm (max. ± 6 mm).</text>
  </g>

  <!-- ===================== titelblok ===================== -->
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="900" y="790" width="460" height="160"/>
  </g>
