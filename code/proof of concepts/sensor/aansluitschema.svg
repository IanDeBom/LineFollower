    <text x="1268" y="125">+5V</text><text x="1268" y="745">GND</text>
  </g>

  <!-- ===================== -U1 Arduino Nano ===================== -->
  <rect x="150" y="200" width="200" height="490" fill="none" stroke="#000" stroke-width="2"/>
  <text x="225" y="440" text-anchor="middle" font-weight="bold" font-size="16">-U1</text>
  <text x="225" y="460" text-anchor="middle">Arduino Nano</text>
  <g stroke="#000" stroke-width="2">
